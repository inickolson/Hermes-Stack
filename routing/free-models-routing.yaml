  coder:
    primary: nvidia/nemotron-3-super-120b-a12b
    secondary: moonshotai/kimi-k3.1-pro
    tertiary: deepseek-v4.1-flash:free
    rationale: "nemotron-super для кода, kimi-k3.1-pro для сложного рассуждения, deepseek-v4 как фолбэк"
  writer:
    primary: gemini-3.8-flash
    secondary: claude-haiku-5.5:free
    tertiary: gemini-2.5-flash
    rationale: "Gemini для текста, claude-haiku как альтернатива, gemini-2.5 как фолбэк"
  seo:
    primary: gemini-3.8-flash
    secondary: gemini-2.5-flash
    tertiary: claude-haiku-5.5:free
    rationale: "Gemini приоритет для SEO контента"
  orchestrator:
    primary: gemini-3.8-flash
    secondary: moonshotai/kimi-k3.1-pro
    tertiary: thinking-machines/inkling-small:free
    rationale: "flash — быстрый на коротких решениях; kimi-k3.1-pro для сложных;"
  vision:
