services:

  hermes:
    build: ./hermes
    container_name: hermes
    restart: unless-stopped
    ports:
      - "127.0.0.1:8020:8020"
    volumes:
      - ./data:/root
      - ./hermes/tools:/opt/hermes-tools:ro
      - /opt/hermes-backups:/opt/hermes-backups:ro
    environment:
      - GATEWAY_ALLOW_ALL_USERS=true
      - HERMES_INSECURE=true
      - OPEN_NOTEBOOK_API=http://open-notebook:5055
      - TZ=Europe/Moscow
      - OPS_TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OPS_TELEGRAM_CHAT_ID=1245452617
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s    

  surrealdb:
    image: surrealdb/surrealdb:v2
    container_name: surrealdb
    restart: unless-stopped
    command: start --log info --user root --pass root rocksdb:/mydata/mydatabase.db
    user: root
    expose:
      - "8000"
    volumes:
      - ./data/open-notebook/surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true

  open-notebook:
    image: lfnovo/open_notebook:v1-latest
    container_name: open-notebook
    restart: unless-stopped
    depends_on:
      - surrealdb
    ports:
      - "127.0.0.1:8502:8502"
      - "127.0.0.1:5055:5055"
    environment:
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPEN_NOTEBOOK_ENCRYPTION_KEY}
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=root
      - SURREAL_PASSWORD=root
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook
    volumes:
      - ./data/open-notebook/notebook_data:/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8502/notebooks"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s  
