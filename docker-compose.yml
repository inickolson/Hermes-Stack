version: '3.8'

services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    container_name: surrealdb
    restart: unless-stopped
    ports:
      - "8081:8000"
    command: start --log info --user root --pass root rocksdb:/mydata/mydatabase.db

  open-notebook:
    image: lfnovo/open_notebook:v1-latest
    container_name: open-notebook
    restart: unless-stopped
    depends_on:
      - surrealdb
    ports:
      - "127.0.0.1:8502:8502"
      - "127.0.0.1:5055:5055"
    environment:
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPE...KEY}
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=root
      - SURREAL_PASSWORD=***
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook
    volumes:
      - ./data/open-notebook/notebook_data:/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8502/notebooks"]
      timeout: 10s
      retries: 3
      start_period: 30s

  hermes: # ⚠ отступ строго 2 пробела — иначе YAML dup key
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    depends_on:
      - surrealdb
    command: gateway run
    ports:
      # Только loopback! Наружу порты НЕ публикуются — доступ через:
      # ssh -L 9119:127.0.0.1:9119 -L 8642:127.0.0.1:8642 root@89.22.234.108
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"
    volumes:
      # Bind-mount. Внутренний пользователь hermes = uid/gid 10000.
      # После пересоздания директории обязательно:
      # chown -R 10000:10000 /opt/hermes-stack/hermes-v20-data
      - /opt/hermes-stack/hermes-v20-data:/opt/data
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=***
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HER...ORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HER...RET}
    env_file:
      - .env
